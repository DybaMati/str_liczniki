<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ title }} — {{ site_brand|default('Panel odczytów') }}</title>
  <style>
    :root { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #121212;
      color: #e5e5e5;
      min-height: 100vh;
      -webkit-text-size-adjust: 100%;
    }
    a { color: #93c5fd; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .nav {
      position: sticky;
      top: 0;
      z-index: 200;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      align-items: center;
      justify-content: flex-start;
      padding: 10px max(14px, env(safe-area-inset-right)) 10px max(14px, env(safe-area-inset-left));
      padding-top: max(10px, env(safe-area-inset-top));
      background: #1a1a1a;
      border-bottom: 1px solid #333;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    .nav-main {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .nav strong { margin-right: 2px; font-size: clamp(0.9rem, 3vw, 1rem); white-space: nowrap; }
    .nav a { padding: 8px 10px; border-radius: 6px; font-size: clamp(0.85rem, 3vw, 0.95rem); white-space: nowrap; }
    .nav a.active { background: rgba(59, 130, 246, 0.25); color: #fff; }
    .nav-status {
      margin-left: auto;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      max-width: 100%;
      align-items: center;
      justify-content: flex-end;
    }
    #nav-tcp { flex: 0 1 auto; }
    #nav-refresh { flex: 0 1 auto; }
    .nav-clock {
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      line-height: 1.1;
      color: #f8fafc;
      font-size: clamp(1.05rem, 2.5vw, 2.05rem);
      font-weight: 600;
      letter-spacing: 0.03em;
      max-width: 100%;
      text-align: right;
    }
    .nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      line-height: 1.2;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid #383838;
      color: #9ca3af;
    }
    .nav-pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      flex-shrink: 0;
      opacity: 0.95;
    }
    .nav-pill-label {
      color: #6b7280;
      font-weight: 600;
      font-size: 9px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .nav-pill-val {
      color: #e5e7eb;
      font-weight: 600;
    }
    #nav-tcp.nav-tcp-ok {
      color: #6ee7b7;
      background: rgba(52, 211, 153, 0.1);
      border-color: rgba(52, 211, 153, 0.35);
    }
    #nav-tcp.nav-tcp-ok .nav-pill-dot { box-shadow: 0 0 8px rgba(52, 211, 153, 0.55); }
    #nav-tcp.nav-tcp-bad {
      color: #fca5a5;
      background: rgba(248, 113, 113, 0.1);
      border-color: rgba(248, 113, 113, 0.35);
    }
    #nav-tcp.nav-tcp-wait {
      color: #fcd34d;
      background: rgba(251, 191, 36, 0.08);
      border-color: rgba(251, 191, 36, 0.3);
    }
    #nav-tcp.nav-tcp-wait .nav-pill-dot { animation: nav-tcp-pulse 1.2s ease-in-out infinite; }
    @keyframes nav-tcp-pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.85); }
    }
    .nav-pill-data {
      background: rgba(59, 130, 246, 0.08);
      border-color: rgba(59, 130, 246, 0.28);
    }
    .nav-pill-data .nav-pill-label { color: #60a5fa; }
    .nav-pill-data .nav-pill-val { color: #f3f4f6; font-size: 12px; }
    @media (min-width: 721px) {
      .nav-status {
        gap: 8px 14px;
        padding: 2px 0;
        width: auto;
        min-width: 280px;
      }
      .nav-pill {
        font-size: 12px;
        padding: 5px 12px;
        gap: 7px;
      }
      .nav-pill-label { font-size: 10px; }
      .nav-pill-data .nav-pill-val { font-size: 13px; }
    }
    main {
      padding: 12px max(12px, env(safe-area-inset-right)) 28px max(12px, env(safe-area-inset-left));
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    @media (max-width: 720px) {
      .nav { gap: 6px 8px; }
      .nav-brand { display: none; }
      .nav-desktop-only { display: none; }
      .nav-main { gap: 6px 8px; width: 100%; }
      .nav a { padding: 6px 8px; }
      .nav-status {
        flex: 1 0 100%;
        width: 100%;
        min-width: 0;
        margin-left: 0;
        padding-top: 6px;
        border-top: 1px solid #2a2a2a;
        gap: 6px 8px;
        display: grid;
        grid-template-columns: auto auto minmax(0, 1fr);
        align-items: center;
      }
      #nav-tcp { justify-self: start; }
      #nav-refresh { justify-self: start; }
      #nav-clock { justify-self: end; grid-column: 3; }
      .nav-pill { font-size: 10px; padding: 4px 8px; gap: 4px; }
      .nav-pill-dot { width: 6px; height: 6px; }
      .nav-pill-data .nav-pill-val { font-size: 11px; }
      #nav-refresh .nav-pill-val { font-size: 10px; }
      .nav-clock {
        font-size: clamp(11px, 3.1vw, 15px);
        font-weight: 600;
        color: #e5e5e5;
        letter-spacing: 0.02em;
      }
    }
    .toast-copy {
      position: fixed;
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(12px);
      opacity: 0;
      pointer-events: none;
      background: rgba(30, 30, 30, 0.96);
      border: 1px solid #4b5563;
      color: #f3f4f6;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 10000;
      transition: opacity 0.2s ease, transform 0.2s ease;
      max-width: min(92vw, 320px);
      text-align: center;
      white-space: nowrap;
    }
    .toast-copy.toast-near {
      bottom: auto;
      transform: translate(-50%, calc(-100% - 6px));
    }
    .toast-copy.show {
      opacity: 1;
    }
    .toast-copy.show:not(.toast-near) {
      transform: translateX(-50%) translateY(0);
    }
    .toast-copy.toast-near.show {
      transform: translate(-50%, calc(-100% - 6px));
    }
    .copy-val { cursor: copy; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
    .copy-val.copy-flash { outline: 1px solid rgba(59, 130, 246, 0.65); border-radius: 4px; }
    /* Tooltip ECharts — pod sticky nav (z-index 200), nie nachodzi na pasek przy scrollu */
    .panel-echart-tip { z-index: 150 !important; }
    .pv-chart-box, .spark-wrap { position: relative; z-index: 1; }
    @media (max-width: 480px) {
      .nav { padding-top: 8px; padding-bottom: 8px; }
    }
    .err { color: #f87171; margin-top: 8px; font-size: 14px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <nav class="nav">
    <div class="nav-main">
      <strong class="nav-brand">{{ site_brand|default('Panel odczytów') }}</strong>
      <a href="/live" class="{{ 'active' if active == 'live' else '' }}">Na żywo</a>
      <a href="/chart" class="{{ 'active' if active == 'chart' else '' }}">Wykres mocy</a>
      <a href="/meters" class="{{ 'active' if active == 'meters' else '' }}">Zużycie kWh</a>
      <a href="/fv" class="nav-desktop-only {{ 'active' if active == 'fv' else '' }}">Rozliczenie FV</a>
    </div>
    <div class="nav-status" id="nav-status" aria-live="polite">
      <span class="nav-pill nav-tcp-wait" id="nav-tcp">
        <span class="nav-pill-dot" aria-hidden="true"></span>
        <span class="nav-pill-label">TCP</span>
        <span class="nav-pill-val" id="nav-tcp-text">...</span>
      </span>
      <span class="nav-pill nav-pill-data" id="nav-refresh">
        <span class="nav-pill-label">Dane</span>
        <span class="nav-pill-val" id="nav-refresh-val">—</span>
      </span>
      <div class="nav-clock" id="nav-clock">--</div>
    </div>
  </nav>
  <div class="toast-copy" id="toast-copy" role="status" aria-live="polite"></div>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
  (function () {
    var clockEl = document.getElementById('nav-clock');
    var tcpEl = document.getElementById('nav-tcp');
    var tcpText = document.getElementById('nav-tcp-text');
    var refreshVal = document.getElementById('nav-refresh-val');
    var toastCopy = document.getElementById('toast-copy');
    if (!tcpEl || !tcpText || !refreshVal || !clockEl) return;

    var tcpOk = null;
    var tcpBusy = false;
    var lastDataRefreshAt = null;
    var toastTimer = null;

    function pad2(n) { return (n < 10 ? '0' : '') + n; }

    function fmtClock(d) {
      var dd = pad2(d.getDate());
      var mm = pad2(d.getMonth() + 1);
      var yy = pad2(d.getFullYear() % 100);
      var hh = pad2(d.getHours());
      var mi = pad2(d.getMinutes());
      var ss = pad2(d.getSeconds());
      return dd + '-' + mm + '-' + yy + ' ' + hh + ':' + mi + ':' + ss;
    }

    function setTcp(ok, checking) {
      tcpEl.classList.remove('nav-tcp-ok', 'nav-tcp-bad', 'nav-tcp-wait');
      if (checking) {
        tcpText.textContent = '...';
        tcpEl.classList.add('nav-tcp-wait');
        return;
      }
      if (ok) {
        tcpText.textContent = 'OK';
        tcpEl.classList.add('nav-tcp-ok');
      } else {
        tcpText.textContent = 'brak';
        tcpEl.classList.add('nav-tcp-bad');
      }
    }

    function tickRefreshAge() {
      if (!lastDataRefreshAt) {
        refreshVal.textContent = '—';
        return;
      }
      var sec = Math.floor((Date.now() - lastDataRefreshAt) / 1000);
      if (sec < 3) refreshVal.textContent = 'teraz';
      else if (sec < 60) refreshVal.textContent = sec + ' s temu';
      else refreshVal.textContent = Math.floor(sec / 60) + ' min temu';
    }

    window.panelMarkRefreshed = function () {
      lastDataRefreshAt = Date.now();
      tickRefreshAge();
    };

    function resetToastPos() {
      if (!toastCopy) return;
      toastCopy.classList.remove('show', 'toast-near');
      toastCopy.style.left = '';
      toastCopy.style.top = '';
      toastCopy.style.bottom = '';
    }

    function showToastNear(anchor, msg) {
      if (!toastCopy) return;
      toastCopy.textContent = msg;
      if (anchor && anchor.getBoundingClientRect) {
        var r = anchor.getBoundingClientRect();
        var x = r.left + r.width / 2;
        var y = r.top;
        var pad = 10;
        x = Math.min(window.innerWidth - pad, Math.max(pad, x));
        y = Math.min(window.innerHeight - pad, Math.max(pad + 48, y));
        toastCopy.style.left = x + 'px';
        toastCopy.style.top = y + 'px';
        toastCopy.style.bottom = 'auto';
        toastCopy.classList.add('toast-near');
      } else {
        toastCopy.style.left = '';
        toastCopy.style.top = '';
        toastCopy.style.bottom = '';
        toastCopy.classList.remove('toast-near');
      }
      toastCopy.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(resetToastPos, 1600);
    }

    function isCoarsePointer() {
      try {
        return window.matchMedia('(pointer: coarse)').matches;
      } catch (e) {
        return 'ontouchstart' in window;
      }
    }

    function execCopySync(text) {
      try {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '0';
        ta.style.left = '0';
        ta.style.width = '2em';
        ta.style.height = '2em';
        ta.style.opacity = '0';
        ta.style.pointerEvents = 'none';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, text.length);
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    function copyPlainText(text) {
      text = (text == null) ? '' : String(text).trim();
      if (!text) return Promise.reject();
      if (isCoarsePointer()) {
        return execCopySync(text) ? Promise.resolve() : Promise.reject();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(function () {
          return execCopySync(text) ? Promise.resolve() : Promise.reject();
        });
      }
      return execCopySync(text) ? Promise.resolve() : Promise.reject();
    }

  window.panelCopyOnLongPress = function (el) {
    if (!el || el.__copyBound) return;
    el.__copyBound = true;
    el.classList.add('copy-val');
    var pressTimer = null;
    var lastTapAt = 0;
    var copyLock = false;
    var DOUBLE_TAP_MS = 380;

    function clearPress() {
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    }
    function meterLabelFor(el) {
      var card = el.closest('.meter-card');
      if (card) return (card.getAttribute('data-meter-label') || '').trim();
      var pv = el.closest('.pv-card');
      if (pv) {
        var lbl = pv.querySelector('.pv-card-label');
        return lbl ? (lbl.textContent || '').trim() : '';
      }
      return '';
    }
    function toastMsg(name) {
      if (name) return 'Skopiowano: ' + name;
      return 'Skopiowano';
    }
    function doCopy() {
      if (copyLock) return;
      copyLock = true;
      setTimeout(function () { copyLock = false; }, 450);
      var raw = el.getAttribute('data-copy');
      if (raw == null) raw = (el.textContent || '').trim();
      var name = meterLabelFor(el);
      copyPlainText(raw).then(function () {
        el.classList.add('copy-flash');
        setTimeout(function () { el.classList.remove('copy-flash'); }, 400);
        showToastNear(el, toastMsg(name));
      }).catch(function () {
        showToastNear(el, 'Nie udało się skopiować');
      });
    }
    function onPointerCopy(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      doCopy();
    }
    el.setAttribute('title', 'Kliknij 2× (telefon / mysz), aby skopiować');
    el.addEventListener('touchstart', function () {
      clearPress();
      if (isCoarsePointer()) {
        pressTimer = setTimeout(function () { doCopy(); }, 700);
      }
    }, { passive: true });
    el.addEventListener('touchend', function (e) {
      clearPress();
      var now = Date.now();
      if (now - lastTapAt < DOUBLE_TAP_MS) {
        lastTapAt = 0;
        onPointerCopy(e);
      } else {
        lastTapAt = now;
      }
    }, { passive: false });
    el.addEventListener('touchmove', clearPress, { passive: true });
    el.addEventListener('touchcancel', clearPress, { passive: true });
    el.addEventListener('dblclick', onPointerCopy);
    el.addEventListener('contextmenu', function (e) {
      e.preventDefault();
      doCopy();
    });
  };

    function tickClock() {
      if (clockEl) clockEl.textContent = fmtClock(new Date());
      tickRefreshAge();
    }

    function checkTcp() {
      if (tcpBusy) return;
      tcpBusy = true;
      if (tcpOk === null) setTcp(false, true);
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, 4000);
      fetch('/api/ping', { cache: 'no-store', signal: ctrl.signal })
        .then(function (res) {
          clearTimeout(timer);
          if (!res.ok) throw new Error('bad');
          return res.json();
        })
        .then(function (data) {
          tcpOk = !!(data && data.ok);
          setTcp(tcpOk, false);
        })
        .catch(function () {
          tcpOk = false;
          setTcp(false, false);
        })
        .finally(function () { tcpBusy = false; });
    }

    tickClock();
    setInterval(tickClock, 1000);
    checkTcp();
    setInterval(checkTcp, 2000);
  })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
